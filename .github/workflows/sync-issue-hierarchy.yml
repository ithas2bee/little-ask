name: Establish native EPIC, Feature, and User Story hierarchy
# This workflow is restricted to Little Ask and only establishes planned issue nesting.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-issue-hierarchy.yml"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  establish-hierarchy:
    if: github.repository == 'ithas2bee/little-ask'
    runs-on: ubuntu-latest
    steps:
      - name: Create native GitHub sub-issue relationships
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Fetch all current issues once so the workflow can map issue numbers to GitHub database IDs.
          ISSUE_IDS="$(gh api "repos/${REPOSITORY}/issues?state=all&per_page=100" | jq -c 'map({key:(.number|tostring), value:.id}) | from_entries')"

          link_sub_issue() {
            local parent_number="$1"
            local child_number="$2"
            local child_id

            child_id="$(jq -r --arg number "${child_number}" '.[$number] // empty' <<< "${ISSUE_IDS}")"
            if [[ -z "${child_id}" ]]; then
              echo "::error::Could not find GitHub issue ID for child #${child_number}"
              exit 1
            fi

            if gh api "repos/${REPOSITORY}/issues/${parent_number}/sub_issues?per_page=100" --jq '.[].number' | grep -Fxq "${child_number}"; then
              echo "Already linked: #${parent_number} -> #${child_number}"
              return
            fi

            echo "Linking #${parent_number} -> #${child_number}"
            gh api --method POST "repos/${REPOSITORY}/issues/${parent_number}/sub_issues" \
              -H "Accept: application/vnd.github+json" \
              -F sub_issue_id="${child_id}" >/dev/null

            # GitHub may apply secondary rate limits to rapid sub-issue creation.
            sleep 1
          }

          # EPIC -> Feature
          while read -r parent child; do
            [[ -z "${parent:-}" ]] && continue
            link_sub_issue "${parent}" "${child}"
          done <<'EOF'
          1 6
          1 10
          1 11
          2 12
          2 13
          2 14
          3 15
          3 16
          4 17
          4 18
          4 19
          4 20
          4 21
          5 22
          5 23
          5 24
          5 25
          EOF

          # Feature -> User Story
          while read -r parent child; do
            [[ -z "${parent:-}" ]] && continue
            link_sub_issue "${parent}" "${child}"
          done <<'EOF'
          6 7
          6 8
          6 9
          10 26
          10 27
          11 28
          11 29
          12 30
          12 31
          13 32
          13 33
          14 34
          14 35
          15 36
          16 37
          16 38
          17 39
          18 40
          18 41
          19 42
          19 43
          19 44
          20 45
          20 46
          21 47
          21 48
          22 49
          22 50
          23 51
          23 52
          24 53
          24 54
          25 55
          25 56
          EOF
